{% extends "base.html" %}

{% block title %}Page Not Found (404) | Page-Turn Bookstore{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="display-1 fw-bold text-muted mb-3">404</div>
        <div class="mb-3">
            <i class="bi bi-compass fs-1 text-primary"></i>
        </div>
        <h2 class="h3 fw-bold mb-2">Page Not Found</h2>
        <p class="text-secondary mb-4">
            The page or resource you are looking for does not exist or may have been moved.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('books') }}" class="btn btn-primary">
                <i class="bi bi-journal-bookmark me-1"></i> Browse Books
            </a>
            <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">
                <i class="bi bi-people me-1"></i> View Customers
            </a>
        </div>
    </div>
</div>
{% endblock %}
